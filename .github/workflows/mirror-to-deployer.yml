name: Mirror to deployer

on:
  push:
    branches: [deploy/prod]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror and trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOYER_PAT }}
        run: |
          git config user.name "the-morca-deployer"
          git config user.email "the-morca-deployer@users.noreply.github.com"
          git commit --allow-empty -m "chore: deploy"

          gh auth setup-git
          git push https://github.com/the-morca-deployer/tasmil-finance.git HEAD:refs/heads/main --force
