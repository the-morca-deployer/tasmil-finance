name: SOW2 Release Image

on:
  push:
    branches: [feat-sow2-code-complete]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sow2-image-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tasmil-finance/tasmil-finance

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reject committed credentials
        run: node --test scripts/security.test.mjs

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sow2-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.SOW2_NEXT_PUBLIC_API_URL || 'http://localhost:6756' }}
            NEXT_PUBLIC_AI_URL=${{ vars.SOW2_NEXT_PUBLIC_AI_URL || 'http://localhost:8001' }}
            NEXT_PUBLIC_APP_URL=${{ vars.SOW2_NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_MCP_STELLAR_URL=${{ vars.SOW2_NEXT_PUBLIC_MCP_STELLAR_URL || 'http://localhost:3009' }}
            NEXT_PUBLIC_STELLAR_NETWORK=${{ vars.SOW2_NEXT_PUBLIC_STELLAR_NETWORK || 'testnet' }}
            AI_INTERNAL_URL=${{ vars.SOW2_AI_INTERNAL_URL || 'http://ai:8001' }}
            BACKEND_INTERNAL_URL=${{ vars.SOW2_BACKEND_INTERNAL_URL || 'http://backend:6756' }}
            QUEST_BACKEND_INTERNAL_URL=${{ vars.SOW2_QUEST_BACKEND_INTERNAL_URL || 'http://quest-backend:5555' }}
          secrets: npm_token=${{ secrets.DEPLOYER_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable digest in Git tag
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tag_name="sow2-image-${GITHUB_SHA}"
          tag_message="${IMAGE}@${IMAGE_DIGEST}"
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/${tag_name}"; then
            test "$(git tag -l --format='%(contents:subject)' "${tag_name}")" = "${tag_message}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "sow2-image-${GITHUB_SHA}" -m "${IMAGE}@${IMAGE_DIGEST}"
          git push origin "sow2-image-${GITHUB_SHA}"
